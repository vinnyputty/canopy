name: Canopy
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: canopy-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.16.0'
      - name: Validate version tag
        if: github.event_name == 'push'
        run: node tools/release.mjs tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  check:
    name: ${{ matrix.check_name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            check_name: check (macos-latest)
            platform: darwin/arm64
            artifact: mac-arm64
          - os: windows-2025
            check_name: check (windows-latest)
            platform: win32/x64
            artifact: win-x64
          - os: ubuntu-24.04
            check_name: check (ubuntu-latest)
            platform: linux/x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}
          repository-cache: true
      - name: Parse and compile Windows helper sources
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/windows-native-controls.ps1
      - run: bazel run //:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CANOPY_EXPECT_PLATFORM: ${{ matrix.platform }}
          CANOPY_MANAGED_APPIMAGE: ${{ matrix.platform == 'linux/x64' && '1' || '0' }}
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name != 'push' || matrix.artifact != 'win-x64'
        with:
          name: Canopy-${{ matrix.artifact }}
          path: .cache/verified-packages/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-failure-${{ matrix.artifact }}
          path: .cache/smoke-failure/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  signed-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, check]
    environment: windows-signing
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.16.0'
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Locate Windows SDK verifier
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK SignTool missing' }
          "CANOPY_SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV
      - name: Prepare pinned Artifact Signing SDK in owned runner storage
        shell: pwsh
        run: tools/windows-prepare-signing.ps1
      - run: bazel build //:build
      - name: Build signed Windows packages
        run: bazel run //:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CANOPY_EXPECT_PLATFORM: win32/x64
          CANOPY_WINDOWS_SIGN: '1'
          CANOPY_WINDOWS_POLICY: ${{ vars.WINDOWS_SIGNING_POLICY }}
          AZURE_TENANT_ID: ${{ vars.WINDOWS_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.WINDOWS_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.WINDOWS_SIGNING_CLIENT_SECRET }}
      - name: Verify signed packaged behavior without signing credentials
        run: bazel run //:packaged_smoke
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CANOPY_EXPECT_PLATFORM: win32/x64
      - name: Verify actual installer and embedded executable signatures
        run: node tools/windows-signing.mjs report .cache/verified-packages
        env:
          CANOPY_WINDOWS_POLICY: ${{ vars.WINDOWS_SIGNING_POLICY }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Canopy-win-x64
          path: .cache/verified-packages/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove owned public signing SDK files
        if: always()
        shell: pwsh
        run: |
          if ($env:CANOPY_SIGN_SDK_OWNED) { Remove-Item -LiteralPath $env:CANOPY_SIGN_SDK_OWNED -Recurse -Force }
  draft:
    if: github.event_name == 'push'
    needs: [validate, check, signed-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: Canopy-*
          path: incoming
      - name: Verify packaged reports and assemble release
        run: |
          version=$(node -p 'require("./package.json").version')
          node tools/release.mjs assemble incoming assembled "$RELEASE_TAG" "$version" "$SOURCE_SHA" "$RUN_URL"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Create draft and verify uploaded bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version=$(node -p 'require("./package.json").version')
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${prerelease[@]}" assembled/Canopy-* assembled/SHA256SUMS assembled/release-manifest.json --draft --verify-tag --title "Canopy $version" --notes-file assembled/release-notes.md
          gh release download "$RELEASE_TAG" --dir downloaded
          node tools/release.mjs verify downloaded "$RELEASE_TAG" "$version" "$SOURCE_SHA"
