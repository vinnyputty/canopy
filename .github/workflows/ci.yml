name: Canopy
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}
          repository-cache: true
      - run: bazel build //:build
      - run: bazel test //:test //:typecheck //:format_check --test_output=errors
      - if: runner.os == 'Linux'
        run: xvfb-run -a bazel run //:smoke
      - if: runner.os != 'Linux'
        run: bazel run //:smoke
      - run: bazel run //:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Canopy-${{ runner.os }}
          path: release/*
