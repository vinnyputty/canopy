name: Canopy
on:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin/arm64
            artifact: mac-arm64
          - os: windows-2025
            platform: win32/x64
            artifact: win-x64
          - os: ubuntu-24.04
            platform: linux/x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}
          repository-cache: true
      - run: bazel run //:ci
        env:
          CANOPY_EXPECT_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Canopy-${{ matrix.artifact }}
          path: .cache/verified-packages/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-failure-${{ matrix.artifact }}
          path: .cache/smoke-failure/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
