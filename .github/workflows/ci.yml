name: Canopy
on:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}
          repository-cache: true
      - name: Install Linux font fallbacks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - run: bazel run //:ci
      - name: Upload UI review evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-review-${{ runner.os }}
          path: |
            .cache/ui-review-evidence.json
            .cache/typography/**
            .cache/accessibility/**
            .cache/tree.png
            .cache/preview.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Canopy-${{ runner.os }}
          path: release/*
      - name: Upload smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-failure-${{ runner.os }}
          path: .cache/smoke-failure/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
