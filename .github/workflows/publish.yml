name: Publish qualified Canopy release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with a verified draft and committed native qualification evidence
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: canopy-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    environment: public-release
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.16.0'
      - name: Locate Windows SDK verifier
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK SignTool missing' }
          "CANOPY_SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV
      - name: Verify draft, tag, downloaded bytes and native evidence before publication
        shell: bash
        env:
          CANOPY_WINDOWS_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          CANOPY_WINDOWS_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          source=$(node tools/release.mjs tag-source "$RELEASE_TAG")
          read -r source_sha version <<< "$source"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir downloaded
          node tools/release.mjs publish downloaded "$RELEASE_TAG" "$version" "$source_sha" "release-qualification/$RELEASE_TAG.json" "release-qualification/$RELEASE_TAG.md"
