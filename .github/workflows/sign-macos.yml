name: Prepare signed Canopy draft
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canopy-signed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.16.0'
      - run: node tools/release.mjs tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  mac:
    needs: validate
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-${{ matrix.arch }}
          repository-cache: true
      - name: Build and check source without credentials
        run: bazel build //:build && bazel test //:test //:typecheck //:format_check //:portable_checks //:release_checks //:macos_release_checks --test_output=errors
      - name: Sign, notarize, staple and verify containers
        run: bazel run //:signed_package
        env:
          CANOPY_SIGNED_RELEASE: '1'
          RELEASE_TAG: ${{ github.ref_name }}
          MAC_IDENTITY: ${{ vars.MAC_IDENTITY }}
          MAC_TEAM_ID: ${{ vars.MAC_TEAM_ID }}
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY }}
          MAC_NOTARY_KEY_ID: ${{ vars.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ vars.MAC_NOTARY_ISSUER }}
      - name: Exercise exact signed downloads without credentials
        run: bazel run //:packaged_smoke
        env:
          CANOPY_SIGNED_RELEASE: '1'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Canopy-mac-${{ matrix.arch }}
          path: .cache/verified-packages/*
          include-hidden-files: true
          if-no-files-found: error
  other:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32/x64
            artifact: win-x64
          - os: ubuntu-24.04
            platform: linux/x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}
          repository-cache: true
      - run: bazel run //:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CANOPY_EXPECT_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Canopy-${{ matrix.artifact }}
          path: .cache/verified-packages/*
          include-hidden-files: true
          if-no-files-found: error
  draft:
    needs: [validate, mac, other]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: Canopy-*
          path: incoming
      - name: Assemble verified signed candidate and check uploaded bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version=$(node -p 'require("./package.json").version')
          node tools/release.mjs assemble incoming assembled "$RELEASE_TAG" "$version" "$SOURCE_SHA" "$RUN_URL" signed
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${prerelease[@]}" assembled/Canopy-* assembled/SHA256SUMS assembled/release-manifest.json --draft --verify-tag --title "Canopy $version" --notes-file assembled/release-notes.md
          gh release download "$RELEASE_TAG" --dir downloaded
          node tools/release.mjs verify downloaded "$RELEASE_TAG" "$version" "$SOURCE_SHA"
